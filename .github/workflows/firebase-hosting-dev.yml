name: Deploy to Firebase Hosting (dev)

on:
  push:
    branches: [ "dev" ]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci
      - run: npm run build

      - name: Deploy
        run: npx firebase-tools deploy --only hosting:monthly-balance-548d1 --project monthly-balance-548d1 --token "${{ secrets.FIREBASE_TOKEN }}"
