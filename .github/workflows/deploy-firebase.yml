name: Deploy to Firebase

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm install --prefix functions --no-audit --no-fund

      - name: Inject Firebase web envs
        run: |
          cat > .env.production << 'EOF'
          VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_OCR_PARSE_ENDPOINT=${{ secrets.VITE_OCR_PARSE_ENDPOINT }}
          EOF

      - name: Inject Functions envs
        run: |
          cat > functions/.env << 'EOF'
          OCR_SPACE_API_KEY=${{ secrets.OCR_SPACE_API_KEY }}
          ALLOWED_EMAILS=${{ secrets.ALLOWED_EMAILS }}
          EOF

      - name: Build project
        run: npm run build

      - name: Prepare Firebase credentials
        run: |
          cat > "$RUNNER_TEMP/firebase-service-account.json" << 'EOF'
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MONTHLY_BALANCE }}
          EOF
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy backend config (rules, indexes, storage, functions)
        run: npx firebase-tools deploy --only firestore:rules,firestore:indexes,storage,functions:ocrParse --project monthly-balance-548d1 --non-interactive

      - name: Select Firebase channel by branch
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "CHANNEL_ID=live" >> "$GITHUB_ENV"
          else
            echo "CHANNEL_ID=dev" >> "$GITHUB_ENV"
          fi

      - name: Deploy Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_MONTHLY_BALANCE }}"
          projectId: "monthly-balance-548d1"
          channelId: "${{ env.CHANNEL_ID }}"

