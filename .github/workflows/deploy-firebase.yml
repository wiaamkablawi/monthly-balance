name: Deploy to Firebase

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm install --prefix functions --no-audit --no-fund

      - name: Inject Firebase web envs
        run: |
          cat > .env.production << 'EOF'
          VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_OCR_PARSE_ENDPOINT=${{ secrets.VITE_OCR_PARSE_ENDPOINT }}
          EOF

      - name: Inject Functions envs
        env:
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
        run: |
          normalized_allowed_emails="$(printf '%s' "$ALLOWED_EMAILS" | tr '\r\n' ',,' | sed -E "s/^[[:space:]]*const[[:space:]]+allowedEmails[[:space:]]*=[[:space:]]*//I; s/[\"']//g; s/[[:space:]]//g; s/,,*/,/g; s/^,*//; s/,*$//")"
          {
            printf 'ALLOWED_EMAILS=%s\n' "$normalized_allowed_emails"
          } > functions/.env

      - name: Build project
        run: npm run build

      - name: Deploy backend config (rules, storage)
        run: npx firebase-tools deploy --only firestore:rules,storage --project monthly-balance-548d1 --non-interactive --token "$FIREBASE_TOKEN"

      - name: Deploy Cloud Function ocrParse (non-blocking)
        id: deploy_function
        continue-on-error: true
        run: npx firebase-tools deploy --only functions:ocrParse --project monthly-balance-548d1 --non-interactive --token "$FIREBASE_TOKEN"

      - name: Warn when Cloud Function deployment fails
        if: ${{ steps.deploy_function.outcome == 'failure' }}
        run: echo "::warning::Cloud Function deployment failed due to IAM/API permissions (for example cloudbilling/eventarc/run). Deploy continued without function update."

      - name: Deploy Firestore indexes (non-blocking)
        id: deploy_indexes
        continue-on-error: true
        run: npx firebase-tools deploy --only firestore:indexes --project monthly-balance-548d1 --non-interactive --token "$FIREBASE_TOKEN"

      - name: Warn when Firestore indexes deployment fails
        if: ${{ steps.deploy_indexes.outcome == 'failure' }}
        run: echo "::warning::Firestore indexes deployment failed due to IAM/API permissions. App deploy completed without index updates."

      - name: Select Firebase channel by branch
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "CHANNEL_ID=live" >> "$GITHUB_ENV"
          else
            echo "CHANNEL_ID=dev" >> "$GITHUB_ENV"
          fi

      - name: Deploy Hosting
        run: |
          if [ "$CHANNEL_ID" = "live" ]; then
            npx firebase-tools deploy --only hosting --project monthly-balance-548d1 --non-interactive --token "$FIREBASE_TOKEN"
          else
            set +e
            output="$(npx firebase-tools hosting:channel:deploy "$CHANNEL_ID" --project monthly-balance-548d1 --expires 7d --non-interactive --token "$FIREBASE_TOKEN" 2>&1)"
            status=$?
            set -e
            printf '%s\n' "$output"
            if [ "$status" -ne 0 ] && ! printf '%s\n' "$output" | grep -q "current active version"; then
              exit "$status"
            fi
          fi
